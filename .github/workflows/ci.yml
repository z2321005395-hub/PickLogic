name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      upload_candidates:
        description: Upload the verified Windows and Android candidate packages
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  # Pull requests already run the complete gate. Preserve direct develop pushes,
  # but do not rebuild the same tree after GitHub creates its merge commit.
  quality:
    name: Format, analyze, tests, audits
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop' && startsWith(github.event.head_commit.message, 'Merge pull request')) && github.event.action != 'labeled' && (github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Flutter SDK archives exceed 1.5 GiB per ref and quickly exhaust the
          # repository Actions cache quota. Hosted runs download them instead.
          cache: false
      - name: Resolve workspace
        run: |
          flutter config --no-analytics
          flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Prepare pinned SQLite native asset
        run: dart run tools/prepare_sqlite_native_asset.dart
      - name: Test pure Dart and synthetic modules
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            core_models classification_rules search_index duplicate_engine \
            insight_engine operation_planner preview_core literature_core \
            research_core system_insight_core file_index; do
            (cd "packages/$package" && dart test --reporter compact)
          done
          (cd test_fixtures && dart test --reporter compact)
      - name: Test Flutter shells and bridges
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/prepare_pdfium_native_asset.dart --flutter-test-runtime
          for package in \
            packages/shared_ui platform/windows_bridge platform/android_bridge \
            apps/desktop apps/mobile; do
            (cd "$package" && flutter test --reporter compact)
          done
      - name: Audit dependency licenses
        run: dart run tools/dependency_license_check.dart
      - name: Scan committed source for private data and secrets
        run: dart run tools/privacy_check.dart

  android:
    name: Android debug build
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop' && startsWith(github.event.head_commit.message, 'Merge pull request')) && (github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'develop') && (github.event.action != 'labeled' || github.event.label.name == 'device-validation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Resolve workspace
        run: |
          flutter config --no-analytics
          flutter pub get
      - name: Build installable arm64 debug APK
        if: github.event.action != 'labeled'
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --debug --target-platform android-arm64; then
              break
            fi
            if (( attempt == 3 )); then exit 1; fi
            delay=$((attempt * 15))
            echo "Retrying Android debug build in ${delay}s after a transient tool download failure."
            sleep "$delay"
          done
      - name: Measure installable arm64 debug APK
        if: github.event.action != 'labeled'
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          stat --printf='ANDROID_DEBUG_ARM64_APK_BYTES=%s\n' \
            "$apk"
      - name: Build unsigned arm64 release APK for size gate
        if: github.event_name != 'pull_request'
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release --target-platform android-arm64; then
              break
            fi
            if (( attempt == 3 )); then exit 1; fi
            delay=$((attempt * 15))
            echo "Retrying Android release build in ${delay}s after a transient tool download failure."
            sleep "$delay"
          done
      - name: Measure unsigned release APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          bytes=$(stat --printf='%s' "$apk")
          printf 'ANDROID_RELEASE_UNSIGNED_ARM64_APK_BYTES=%s\n' "$bytes"
          if (( bytes > 40 * 1024 * 1024 )); then
            echo 'Android arm64 release APK exceeds the 40 MB base budget.' >&2
            exit 1
          fi
          sha256sum "$apk"
      - name: Stage Android candidate packages
        if: (github.event_name == 'workflow_dispatch' && inputs.upload_candidates) || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/android
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk \
            ci_artifacts/android/picklogic-mobile-v0.1.0-alpha-debug-arm64.apk
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
            ci_artifacts/android/picklogic-mobile-v0.1.0-alpha-release-unsigned-arm64.apk
          (cd ci_artifacts/android && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload Android candidate packages
        if: (github.event_name == 'workflow_dispatch' && inputs.upload_candidates) || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: picklogic-android-candidate
          path: ci_artifacts/android
          if-no-files-found: error
          retention-days: 3

      - name: Build opt-in x86_64 emulator Debug APK
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'device-validation')
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          dart run ../../tools/prepare_sqlite_native_asset.dart --target android-x64
          rm -f build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/apk/debug/app-debug.apk
          for attempt in 1 2 3; do
            if flutter build apk --debug --target-platform android-x64; then
              break
            fi
            if (( attempt == 3 )); then exit 1; fi
            delay=$((attempt * 15))
            echo "Retrying x86_64 emulator build in ${delay}s after a transient tool download failure."
            sleep "$delay"
          done
      - name: Validate x86_64 emulator APK
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'device-validation')
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          native_paths=$(unzip -Z1 "$apk" | grep '^lib/' || true)
          if [[ -z "$native_paths" ]] || \
             grep -qv '^lib/x86_64/' <<<"$native_paths" || \
             ! grep -qx 'lib/x86_64/libsqlite3.so' <<<"$native_paths"; then
            echo 'Emulator APK must contain only x86_64 native libraries, including SQLite.' >&2
            printf '%s\n' "$native_paths" >&2
            exit 1
          fi
          stat --printf='ANDROID_DEBUG_X86_64_APK_BYTES=%s\n' \
            "$apk"
          sha256sum "$apk"

  windows:
    name: Windows Standard and Pro builds
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop' && startsWith(github.event.head_commit.message, 'Merge pull request')) && github.event.action != 'labeled' && (github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'develop') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      - name: Resolve workspace
        shell: pwsh
        run: |
          flutter config --no-analytics
          flutter pub get
      - name: Prepare pinned native assets for Standard
        shell: pwsh
        run: |
          dart run tools/prepare_sqlite_native_asset.dart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dart run tools/prepare_pdfium_native_asset.dart
      - name: Compile Standard
        working-directory: apps/desktop
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            flutter build windows --release --target lib/main_standard.dart
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 2) { exit 1 }
            Write-Output 'Retrying Standard build in 15s after a transient native-asset failure.'
            Start-Sleep -Seconds 15
          }
      - name: Verify and measure Standard
        shell: pwsh
        run: |
          $target = 'apps/desktop/build/windows/x64/runner/Release'
          dart run tools/package_pdfium_notices.dart --build-directory $target
          $runtimeBytes = (Get-ChildItem -LiteralPath $target -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output "WINDOWS_STANDARD_RUNTIME_BYTES=$runtimeBytes"
          Copy-Item -LiteralPath 'docs/INSTALLATION.md' -Destination "$target/INSTALLATION.md"
          Copy-Item -LiteralPath 'LICENSE' -Destination "$target/LICENSE"
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination "$target/THIRD_PARTY_NOTICES.md"
          $bytes = (Get-ChildItem -LiteralPath $target -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output "WINDOWS_STANDARD_INSTALLED_BYTES=$bytes"
          if ($bytes -gt 80MB) { throw 'Windows Standard exceeds the 80 MB base budget.' }
      - name: Stage Standard candidate package
        if: (github.event_name == 'workflow_dispatch' && inputs.upload_candidates) || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $source = 'apps/desktop/build/windows/x64/runner/Release'
          $target = 'ci_artifacts/windows-standard'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Recurse
      - name: Clean shared desktop output
        working-directory: apps/desktop
        run: flutter clean
      - name: Resolve workspace for Pro
        run: flutter pub get
      - name: Prepare pinned native assets for Pro
        shell: pwsh
        run: |
          dart run tools/prepare_sqlite_native_asset.dart
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dart run tools/prepare_pdfium_native_asset.dart
      - name: Build Pro
        working-directory: apps/desktop
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            flutter build windows --release --target lib/main_pro.dart
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 2) { exit 1 }
            Write-Output 'Retrying Pro build in 15s after a transient native-asset failure.'
            Start-Sleep -Seconds 15
          }
      - name: Smoke packaged Pro PDF engine and content editing
        shell: pwsh
        run: |
          $release = (Resolve-Path -LiteralPath 'apps/desktop/build/windows/x64/runner/Release').Path
          $exe = Join-Path $release 'picklogic_desktop.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--synthetic-pdf-smoke' -WorkingDirectory $release -Wait -PassThru
          Write-Output "PRO_PDF_ENGINE_SMOKE_EXIT=$($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw 'Packaged Pro PDF engine smoke failed.' }
          $editProcess = Start-Process -FilePath $exe -ArgumentList '--synthetic-pdf-content-edit-smoke' -WorkingDirectory $release -Wait -PassThru
          Write-Output "PRO_PDF_CONTENT_EDIT_SMOKE_EXIT=$($editProcess.ExitCode)"
          if ($editProcess.ExitCode -ne 0) { throw 'Packaged Pro PDF content editing smoke failed.' }
      - name: Verify and measure Pro
        shell: pwsh
        run: |
          $target = 'apps/desktop/build/windows/x64/runner/Release'
          dart run tools/package_pdfium_notices.dart --build-directory $target
          $runtimeBytes = (Get-ChildItem -LiteralPath $target -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output "WINDOWS_PRO_RUNTIME_BYTES=$runtimeBytes"
          Copy-Item -LiteralPath 'docs/INSTALLATION.md' -Destination "$target/INSTALLATION.md"
          Copy-Item -LiteralPath 'LICENSE' -Destination "$target/LICENSE"
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination "$target/THIRD_PARTY_NOTICES.md"
          $bytes = (Get-ChildItem -LiteralPath $target -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output "WINDOWS_PRO_INSTALLED_BYTES=$bytes"
          if ($bytes -gt 130MB) { throw 'Windows Pro exceeds the 130 MB base budget.' }
      - name: Stage Pro candidate package
        if: (github.event_name == 'workflow_dispatch' && inputs.upload_candidates) || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $source = 'apps/desktop/build/windows/x64/runner/Release'
          $target = 'ci_artifacts/windows-pro'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Recurse
      - name: Package Windows alpha bundles
        if: (github.event_name == 'workflow_dispatch' && inputs.upload_candidates) || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path 'ci_artifacts/windows-standard/*' -DestinationPath 'ci_artifacts/picklogic-windows-standard-v0.1.0-alpha.zip' -CompressionLevel Optimal
          Compress-Archive -Path 'ci_artifacts/windows-pro/*' -DestinationPath 'ci_artifacts/picklogic-windows-pro-v0.1.0-alpha.zip' -CompressionLevel Optimal
          $packages = Get-ChildItem -LiteralPath 'ci_artifacts' -Filter '*.zip' -File | Sort-Object Name
          $lines = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          $lines | Set-Content -LiteralPath 'ci_artifacts/SHA256SUMS.txt' -Encoding ascii
          foreach ($package in $packages) {
            Write-Output "WINDOWS_PACKAGE name=$($package.Name) bytes=$($package.Length)"
          }
      - name: Upload Windows candidate packages
        if: (github.event_name == 'workflow_dispatch' && inputs.upload_candidates) || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: picklogic-windows-candidate
          path: |
            ci_artifacts/*.zip
            ci_artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

name: picklogic_shared_ui
description: Shared design tokens, localization, and safety widgets for PickLogic.
version: 0.1.0-alpha
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: 2.3.0
  picklogic_core_models:
    path: ../core_models
  video_player: 2.13.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/icons/

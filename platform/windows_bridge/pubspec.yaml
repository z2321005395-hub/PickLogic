name: picklogic_windows_bridge
description: Narrow Windows bridge for PickLogic.
version: 0.1.0-alpha
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: PicklogicWindowsBridgePluginCApi
